repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        exclude: "docs/examples/advanced/cross_source_refs/t_string\\.py"

      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        exclude: "docs/examples/advanced/cross_source_refs/t_string\\.py"

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        args: [src, tests, docs]
        language: system
        types: [python]
        pass_filenames: false
        exclude: "docs/examples/advanced/cross_source_refs/t_string\\.py"

      - id: pyright
        name: pyright
        entry: .venv/bin/pyright
        args: [src, tests, docs]
        language: system
        types: [python]
        pass_filenames: false
        exclude: "docs/examples/advanced/cross_source_refs/t_string\\.py"
