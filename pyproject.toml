[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dature"
dynamic = ["version"]
description = "Type-safe configuration loader for Python dataclasses with support for YAML, JSON, TOML, INI, ENV and environment variables"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Niccolum", email = "lastsal@mail.ru" },
]
keywords = [
    "configuration",
    "config",
    "dataclass",
    "type-safe",
    "yaml",
    "json",
    "json5",
    "toml",
    "ini",
    "env",
    "settings",
    "loader",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "adaptix>=3.0.0b12",
]

[project.urls]
Homepage = "https://github.com/reagento/dature"
Repository = "https://github.com/reagento/dature"
Issues = "https://github.com/reagento/dature/issues"
Documentation = "https://dature.readthedocs.io/"

[project.scripts]
dature = "dature.cli:main"

[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.18"]
json5 = ["json-five>=1.1.2"]
toml = ["toml-rs>=0.3.4"]
secure = ["random-string-detector>=1.1.1"]
vault = ["hvac>=2.0"]
consul = ["py-consul>=1.7"]
etcd = ["etcd3gw>=2.7"]
zookeeper = ["kazoo>=2.11"]
aws = ["boto3>=1.34"]
azure-appconfig = ["azure-appconfiguration>=1.5", "azure-identity>=1.16"]
azure-keyvault = ["azure-keyvault-secrets>=4.11", "azure-identity>=1.16"]
gcp = ["google-cloud-secret-manager>=2.20"]
# Type stubs for the optional integrations above — only needed by users running
# a static type checker (mypy/pyright). Add ``[<lib>,type-stubs]`` to opt in.
type-stubs = ["types-hvac", "boto3-stubs[secretsmanager,ssm]"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/dature/_version.py"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "docs/examples/advanced/cross_source_refs/t_string.py",
    "src/dature/_version.py",
]

[tool.ruff.format]
exclude = [
    "docs/**/*.md",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # pydocstyle
    "ANN204", # missing return type for __init__
    "SIM108", # ternary operator
    "COM812", # disable the conflicting rule with formatter
    "TC001",  # typing-only first-party import — TYPE_CHECKING is banned in dature
    "TC002",  # typing-only third-party import — TYPE_CHECKING is banned in dature
    "TC003",  # typing-only standard-library import — TYPE_CHECKING is banned in dature
    "CPY001", # Missing copyright notice at top of file
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "TYPE_CHECKING is banned in dature: move imports to module or function scope; resolve cycles by refactoring."

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
    "DTZ001",  # datetime without tzinfo (examples use naive datetime for simplicity)
    "PLR2004", # magic values in examples
    "S101",   # assert (examples use assert for simplicity)
]
"tests/**/*.py" = [
    "S101",    # assert
    "ANN",     # type annotations
    "SLF001",  # private member access
    "DTZ001",  # datetime without tzinfo
    "PLR2004", # magic values in tests
    "S105",    # possible hardcoded password
    "S106",    # possible hardcoded password assigned to argument
    "FBT001",  # boolean argument in function definition
]
"src/dature/loaders/*.py" = [
    "FBT001",  # loader functions accept bool as scalar value, not as a flag
]
"src/dature/cli/*.py" = [
    "T201",    # print (CLI output goes to stdout/stderr)
]
"docs/generate_*.py" = [
    "INP001",  # implicit namespace package
    "T201",    # print (CLI script)
    "S310",    # URL open audit (hardcoded https)
    "BLE001",  # blind exception (graceful fallback)
]
".github/scripts/*.py" = [
    "INP001",  # implicit namespace package
    "S310",    # URL open audit (hardcoded https, PyPI JSON API)
]
"benchmarks/**/*.py" = [
    "INP001",  # implicit namespace package
    "T201",    # print (benchmark output goes to stdout)
    "ANN",     # type annotations
    "PLR2004", # magic values
    "S101",    # assert
    "SLF001",  # private member access
    "FBT",     # boolean arguments
    "ERA001",  # commented-out code
    "SIM115",  # NamedTemporaryFile can't use context manager (need path to persist)
    "ARG003",  # pydantic-settings API requires fixed settings_customise_sources signature
    "E501",    # long lines from external API signatures
    "S603",    # subprocess with trusted sys.executable + explicit path list
    "RUF001",  # × multiplication sign intentional in output formatting
]

[tool.ruff.lint.pylint]
max-args = 6
max-returns = 8

[tool.mypy]
python_version = "3.12"
# t_string.py uses Python 3.14 t-string syntax; mypy cannot parse it under 3.12.
exclude = ["docs/examples/advanced/cross_source_refs/t_string\\.py"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
explicit_package_bases = true
mypy_path = "src:."
plugins = ["dature.mypy_plugin"]

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["no-untyped-def", "arg-type", "call-overload", "func-returns-value", "call-arg", "attr-defined", "index", "no-untyped-call"]

[[tool.mypy.overrides]]
module = "docs.examples.*"
disable_error_code = ["arg-type", "call-overload", "dict-item", "call-arg"]

[[tool.mypy.overrides]]
module = "benchmarks.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "docker.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "consul.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "kazoo.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "grpc.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "google.iam.*"
follow_untyped_imports = true

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests", "docs"]
exclude = ["docs/examples/advanced/cross_source_refs/t_string.py", "benchmarks"]
extraPaths = ["src", "."]

[[tool.pyright.executionEnvironments]]
root = "tests"
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportIndexIssue = "none"
reportGeneralTypeIssues = "none"
reportUnhashable = "none"
reportOptionalSubscript = "none"
reportMissingImports = "none"

[[tool.pyright.executionEnvironments]]
root = "docs/examples"
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportUnhashable = "none"

[[tool.pyright.executionEnvironments]]
root = "."

[tool.coverage.run]
source = ["dature"]
omit = ["src/dature/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
    "src",
]
markers = [
    "integration: tests that require external services via testcontainers (e.g. Vault, Consul, etcd, ZooKeeper, LocalStack, Azure emulators)",
    "examples: tests that execute the docs example scripts as subprocesses",
]

[tool.dature.ci.integration-jobs]
# One CI job per entry. ``dirs`` are subdirectories of tests/integration/sources/.
# ``extras`` names a [project.optional-dependencies] section; the job is parametrized
# across major versions of its first dependency (the primary client lib — a shared
# second dependency like azure-identity is not version-matrixed).
# Every directory under tests/integration/sources/ must appear in exactly one entry —
# .github/workflows/ci.yml::get-integration-jobs fails the build otherwise.
vault            = {dirs = ["vault"], extras = "vault"}
consul           = {dirs = ["consul"], extras = "consul"}
etcd             = {dirs = ["etcd"], extras = "etcd"}
zookeeper        = {dirs = ["zookeeper"], extras = "zookeeper"}
# ssm + secrets_manager share one session-scoped LocalStack container
# (tests/integration/sources/conftest.py) — keep them in a single job.
aws              = {dirs = ["ssm", "secrets_manager"], extras = "aws"}
azure_app_config = {dirs = ["azure_app_config"], extras = "azure-appconfig"}
azure_key_vault  = {dirs = ["azure_key_vault"], extras = "azure-keyvault"}
gcp_secret_manager = {dirs = ["gcp_secret_manager"], extras = "gcp"}

[tool.towncrier]
package = "dature"
package_dir = "src"
directory = "changes"
filename = "CHANGELOG.md"
title_format = "## {version}"
underlines = ["", "", ""]
issue_format = "[#{issue}](https://github.com/reagento/dature/issues/{issue})"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Docs"
showcontent = true

[[tool.towncrier.type]]
directory = "refactor"
name = "Refactoring"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "prek>=0.4.8",
    "towncrier>=25.8.0",
    "tzdata>=2026.2; sys_platform == 'win32'",
    "pytest-cov>=7.1.0",
    "time-machine>=3.2.0",
    "pyright>=1.1.411",
]
integration-tests = [
    "testcontainers[vault,localstack]>=4.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocs-macros-plugin>=1.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-llmstxt>=0.5",
    "mkdocs-minify-plugin>=0.8",
    "pillow>=10.0",
    "cairosvg>=2.7; sys_platform == 'linux'",
    "pymdown-extensions>=10.7",
]
examples = [
    "click>=8",
]
benchmarks = [
    "pydantic-settings[yaml,toml]>=2.0",
    "python-decouple>=3.8",
    "dynaconf>=3.0",
    "hydra-core>=1.3",
    "ruamel.yaml>=0.18",
    "toml-rs>=0.3.4",
]

[tool.uv]
default-groups = ["dev", "examples"]
